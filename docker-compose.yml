services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_meta
      POSTGRES_USER: crm_meta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - crm_meta_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_meta -d crm_meta"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: crm-meta-super-educar:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    command: npm run start
    env_file: ${CRM_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://crm_meta:${POSTGRES_PASSWORD}@postgres:5432/crm_meta
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: crm-meta-super-educar:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    command: npm run worker
    env_file: ${CRM_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://crm_meta:${POSTGRES_PASSWORD}@postgres:5432/crm_meta
      RUN_MIGRATIONS_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/worker-health.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  crm_meta_postgres:
